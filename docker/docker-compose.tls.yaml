# PQ TLS overlay — enables X25519MLKEM768 (hybrid, FIPS 203) TLS 1.3
# on the dashboard's control plane.
#
# Prerequisite: generate a TLS cert first via docker/gen-tls-cert.sh
# (default output: docker/tls/{cert,key}.pem, ECDSA-P256 self-signed).
#
# Use with:
#   ./docker/gen-tls-cert.sh
#   qrlenv run -- docker compose \
#       -f docker-compose.yaml \
#       -f docker-compose.tls.yaml \
#       up
#
# Composable with hardened + seccomp + podman overlays:
#   qrlenv run -- docker compose \
#       -f docker-compose.yaml \
#       -f docker-compose.hardened.yaml \
#       -f docker-compose.seccomp.yaml \
#       -f docker-compose.tls.yaml \
#       up
#
# Under podman-rootless additionally add -f docker-compose.podman.yaml.
#
# The dashboard's status-server.js watches QRL_TLS_CERT + QRL_TLS_KEY;
# when both point at readable PEM files the PQ-TLS listener comes up
# on port ${QRL_TLS_PORT:-8443} in addition to the plain HTTP on 8080.
# The plain HTTP path stays available for backward compat + for
# operators who don't want to deal with cert distribution.
#
# The cert path in the container is /opt/qrl/tls, bind-mounted read-only
# from docker/tls on the host. gen-tls-cert.sh writes the cert with
# mode 0644 on cert.pem and 0600 on key.pem — the container's UID 1000
# needs to be able to read both. On macOS + Linux-rootless the mount
# preserves host UID; on rootful Linux it inherits the process UID
# unless you set QRL_TLS_HOST_DIR to a directory chowned to 1000:1000.

services:

  # --- dashboard: native PQ TLS (Node's tls + OpenSSL 3.5) ------------------

  dashboard:
    volumes:
      - ${QRL_TLS_HOST_DIR:-./tls}:/opt/qrl/tls:ro
    environment:
      QRL_TLS_CERT: /opt/qrl/tls/cert.pem
      QRL_TLS_KEY:  /opt/qrl/tls/key.pem
      QRL_TLS_PORT: "8443"
    ports:
      - "127.0.0.1:${QRL_DASHBOARD_TLS_PORT:-8443}:8443"

  # --- beacon-pqtls: nginx sidecar terminating PQ TLS in front of --------
  # --- beacon-node1's REST gateway (which speaks plain HTTP on 3600) -----
  #
  # Prysm-fork's Go crypto/tls doesn't yet expose ML-KEM in a release
  # we control (task #91 tracks a proper upstream patch). Nginx-alpine
  # ships OpenSSL 3.5.7 with X25519MLKEM768 in the default provider,
  # so the sidecar terminates PQ TLS externally and proxies plaintext
  # over the compose bridge internally.
  #
  # Runs rootless (nginx-unprivileged wouldn't be needed since we
  # listen on 4443 > 1024, but we apply the same read_only + cap_drop
  # posture as the rest of the stack).

  beacon-pqtls:
    # nginxinc/nginx-unprivileged is nginx built to run as UID 101 from
    # the start — no root-only chown of /var/cache/nginx at boot, which
    # the stock nginx:alpine image needs. Same OpenSSL 3.5.7 with ML-KEM
    # in the default provider.
    image: nginxinc/nginx-unprivileged:alpine@sha256:d9083fe47768377ef55dedafd67d4da7c2f2bc2bece7554954f29359deb0dce9
    container_name: qrl-beacon-pqtls
    depends_on: [beacon-node1]
    networks: [qrl-popup]
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777,noexec,nosuid,nodev
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    ulimits:
      core: { soft: 0, hard: 0 }
    volumes:
      - ${QRL_TLS_HOST_DIR:-./tls}:/opt/qrl/tls:ro
      - ./popup-node/nginx-beacon-pqtls.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${QRL_BEACON_TLS_PORT:-3643}:4443"
