# Nginx PQ-TLS terminator in front of beacon-node1's REST gateway.
#
# Beacon-chain (Prysm-fork) speaks plain HTTP on port 3600 for its
# /qrl/v1/* REST API. Go's crypto/tls doesn't yet expose ML-KEM in
# any Prysm release we control, so instead of patching upstream we
# put an OpenSSL 3.5-backed nginx in front. Terminates X25519MLKEM768
# TLS 1.3 externally, proxies plaintext internally over the compose
# bridge (which is namespaced-isolated between operator's compose
# projects).
#
# Wired in via docker/docker-compose.tls.yaml — the beacon-pqtls
# service uses nginx:alpine (OpenSSL 3.5.7, ML-KEM in default provider).
#
# Rotate certs by re-running docker/gen-tls-cert.sh + docker compose
# restart beacon-pqtls.

# PID file in tmpfs — read_only:true rootfs means we can't write to
# the default /run/nginx.pid or /var/run/nginx.pid.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Keep the internal (plaintext) side minimal — nothing to log.
    access_log off;
    error_log /dev/stderr warn;

    # Upstream = beacon-node1's REST gateway (compose service DNS).
    upstream beacon_rest {
        server beacon-node1:3600;
        # Keepalive so we don't storm the beacon with new connections
        # on every request.
        keepalive 32;
    }

    server {
        listen 4443 ssl;
        server_name _;

        # PQ TLS 1.3. X25519MLKEM768 first = hybrid classical + FIPS 203
        # PQ. Fall back to classical X25519 and P-256 for clients that
        # haven't caught up yet.
        ssl_certificate     /opt/qrl/tls/cert.pem;
        ssl_certificate_key /opt/qrl/tls/key.pem;
        ssl_protocols       TLSv1.3;
        ssl_ecdh_curve      X25519MLKEM768:X25519:P-256;

        # OCSP stapling is dependent on a proper CA — off for self-signed.
        ssl_stapling        off;

        # Standard hardening headers. Some are moot on JSON-RPC/gRPC
        # gateway responses (no HTML), but they cost nothing to send.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;

        location / {
            proxy_pass         http://beacon_rest;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;

            # Beacon gateway streams SSE for some endpoints; disable
            # buffering so events land in real time.
            proxy_buffering    off;
        }
    }
}
