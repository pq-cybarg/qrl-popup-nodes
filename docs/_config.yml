title: QRL Popup Nodes
description: >
  Rootless, hardened popup QRL 2.0 blockchain stack — gqrl execution +
  qrysm beacon + validator, packaged as rootless Docker/Podman
  containers with a batteries-included dashboard. Three variants
  (standard, rescue-edition, moscow-chill) run side-by-side.

url: "https://pq-cybarg.github.io"
baseurl: "/qrl-popup-nodes"

remote_theme: just-the-docs/just-the-docs

color_scheme: dark
heading_anchors: true
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

aux_links:
  "GitHub repository":
    - "https://github.com/pq-cybarg/qrl-popup-nodes"
  "Wiki":
    - "https://github.com/pq-cybarg/qrl-popup-nodes/wiki"
aux_links_new_tab: true

nav_external_links:
  - title: Report an issue
    url: https://github.com/pq-cybarg/qrl-popup-nodes/issues/new

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

mermaid:
  version: "10.9.0"

footer_content: >
  &copy; 2026 pq-cybarg · BSD-3-Clause ·
  <a href="https://github.com/pq-cybarg/qrl-popup-nodes">Source on GitHub</a> ·
  Chain is post-quantum safe end-to-end · Never deploy to mainnet.

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge

exclude:
  - vendor/
  - .bundle/
  - Gemfile
  - Gemfile.lock
  - node_modules/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
